<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Three contracts: the reserve sink and settlement vault are immutable; only the coordinator is UUPS-upgradeable by its owner, a 2-of-3 Safe on mainnet; a timelock is planned for phase 1."><title>Three contracts: the reserve sink and settlement vault are immutable; only the coordinator is UUPS-upgradeable by its owner, a 2-of-3 Safe on mainnet; a timelock is planned for phase 1.</title><defs><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="900" height="300" rx="14" fill="#f8fafc"/><text x="30" y="32" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">CUSTODY AND TRUST MODEL</text><text x="30" y="58" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start">Custody: three contracts, only one upgradeable</text><rect x="30" y="84" width="268" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="44" y="107" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#dc2626" text-anchor="start">STReserveSink</text><text x="44" y="127" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">holds every deposit</text><text x="44" y="144" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">no outbound transfer</text><text x="44" y="161" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">staked on reserve hotkey</text><rect x="203.0" y="90" width="81.0" height="21" rx="10.5" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="243.5" y="105" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">immutable</text><rect x="314" y="84" width="268" height="112" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="328" y="107" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#7c3aed" text-anchor="start">STSettlementVault</text><text x="328" y="127" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">owns pool UIDs + escrow</text><text x="328" y="144" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">captures pool emission</text><text x="328" y="161" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">claims cannot be paused</text><rect x="487.0" y="90" width="81.0" height="21" rx="10.5" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="527.5" y="105" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">immutable</text><rect x="598" y="84" width="268" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="612" y="107" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb" text-anchor="start">STCoordinator</text><text x="612" y="127" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">admits NOs (owner only)</text><text x="612" y="144" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">policy + deposit checks</text><text x="612" y="161" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">guardian can pause new risk</text><rect x="722.0" y="90" width="130.0" height="21" rx="10.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="787.0" y="105" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">UUPS upgradeable</text><rect x="598" y="222" width="272" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="612" y="244" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="start">owner: 2-of-3 Safe (mainnet)</text><text x="612" y="263" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">timelock ≥ 1 epoch: planned, phase 1</text><path d="M734 222V200" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m2563eb)"/><text x="30" y="244" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Finalized claims are paid by direct pull to the provider's coldkey.</text><text x="30" y="264" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">No owner, NO or upgrade can move another party's α.</text></svg>
