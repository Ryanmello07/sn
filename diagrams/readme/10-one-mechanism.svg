<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Release 1.0 uses one mechanism: head and pool weights share one native weight vector, normalized to theta and one minus theta, so about 200 head UIDs fit in 256. A second mechanism would split the UID space."><title>Release 1.0 uses one mechanism: head and pool weights share one native weight vector, normalized to theta and one minus theta, so about 200 head UIDs fit in 256. A second mechanism would split the UID space.</title><defs></defs><rect width="900" height="270" rx="14" fill="#f8fafc"/><text x="30" y="32" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">ONE MECHANISM</text><text x="30" y="58" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start">One mechanism, two channels in one weight vector</text><text x="30" y="92" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">RELEASE 1.0 · MECHANISM_COUNT = 1</text><rect x="30" y="102" width="250.0" height="34" rx="8" fill="#0e7490" stroke="none" stroke-width="0"/><text x="155" y="124" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">head fleets → θ</text><rect x="282" y="102" width="588.0" height="34" rx="8" fill="#7c3aed" stroke="none" stroke-width="0"/><text x="576" y="124" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">pool UIDs → 1 − θ</text><text x="30" y="156" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">one vector · one Yuma run · one 256-UID metagraph</text><text x="30" y="190" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">REJECTED · TWO SUB-MECHANISMS</text><rect x="30" y="200" width="418" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/><text x="239" y="222" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">mechanism 0</text><rect x="452" y="200" width="418" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/><text x="661" y="222" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">mechanism 1</text><text x="30" y="254" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Each mechanism gets its own share of the UID space, so neither could hold a ~200-fleet head.</text></svg>
