<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="A fleet starts paid inside a pool, registers its own UID and binds its client_ids to graduate to the head, and is pruned back to the pool by native lowest-emission deregistration. The 256-UID budget is shared by head fleets, pool UIDs, validators and owner identities."><title>A fleet starts paid inside a pool, registers its own UID and binds its client_ids to graduate to the head, and is pruned back to the pool by native lowest-emission deregistration. The 256-UID budget is shared by head fleets, pool UIDs, validators and owner identities.</title><defs><marker id="m0e7490" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><rect width="900" height="380" rx="14" fill="#f8fafc"/><text x="30" y="32" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">TWO MINER TIERS</text><text x="30" y="58" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start">Two tiers: a pooled tail and a direct head</text><rect x="30" y="84" width="360" height="108" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="44" y="107" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="start">Pool tier (tail)</text><text x="44" y="127" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">one vault-owned UID per NO</text><text x="44" y="144" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">providers are client_ids, no UID, no burn</text><text x="44" y="161" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">paid by Merkle claim inside the pool</text><text x="44" y="178" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">low barrier, baseline pay</text><rect x="510" y="84" width="360" height="108" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/><text x="524" y="107" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0e7490" text-anchor="start">Head tier (≤ 200 fleets)</text><text x="524" y="127" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">a fleet = one hotkey binding many client_ids</text><text x="524" y="144" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">own UID, paid natively each tempo</text><text x="524" y="161" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">ranked by routable-prefix breadth</text><text x="524" y="178" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">no contract, no operator in the payout path</text><path d="M390 112H506" fill="none" stroke="#0e7490" stroke-width="1.8" marker-end="url(#m0e7490)"/><text x="448" y="104" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#0e7490" text-anchor="middle">burn-register</text><text x="448" y="128" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#0e7490" text-anchor="middle">+ dual-signed bind</text><path d="M510 162H394" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mdc2626)"/><text x="452" y="178" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#dc2626" text-anchor="middle">pruned</text><text x="30" y="214" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">A client_id earns in one tier at a time: the NO server drops bound clients from its payout root (off-chain check).</text><text x="30" y="240" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">256-UID BUDGET (EXAMPLE: 64 VALIDATORS, 2 NOS)</text><rect x="30" y="252" width="208.0" height="30" rx="6" fill="#d97706" stroke="none" stroke-width="0"/><text x="134.0" y="272" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">validators</text><rect x="240.0" y="252" width="4.5625" height="30" rx="6" fill="#64748b" stroke="none" stroke-width="0"/><rect x="246.5625" y="252" width="4.5625" height="30" rx="6" fill="#7c3aed" stroke="none" stroke-width="0"/><rect x="253.125" y="252" width="614.875" height="30" rx="6" fill="#0e7490" stroke="none" stroke-width="0"/><text x="560.5625" y="272" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">head fleets  (≤ 188 here, cap 200)</text><text x="246.0" y="300" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="start">owner + escrow (2) · pool UIDs (1 per NO)</text><rect x="30" y="314" width="840" height="48" rx="10" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="46" y="334" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">The head gets what is left. With 56 validators (the whitepaper target) and 200 fleets, no room remains for pools,</text><text x="46" y="351" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">so the practical head is 256 − validators − pools − 2. Losing fleets earn 0 and are pruned when a new fleet registers.</text></svg>
