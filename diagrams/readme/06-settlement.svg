<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Settlement timeline: at the epoch boundary anyone closes the epoch and the vault moves pool emission to escrow; the NO commits a payout root within four hours; after 48 hours anyone finalizes and claims open; claims expire after epoch e plus nine and the remainder carries to the same NO."><title>Settlement timeline: at the epoch boundary anyone closes the epoch and the vault moves pool emission to escrow; the NO commits a payout root within four hours; after 48 hours anyone finalizes and claims open; claims expire after epoch e plus nine and the remainder carries to the same NO.</title><defs><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs><rect width="900" height="330" rx="14" fill="#f8fafc"/><text x="30" y="32" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">CHANNEL 3 · SETTLEMENT</text><text x="30" y="58" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start">One settlement epoch (mainnet: 50,400 blocks ≈ 7 days)</text><rect x="100" y="147" width="730" height="6" rx="3" fill="#e2e8f0" stroke="none" stroke-width="0"/><circle cx="100" cy="150" r="9" fill="#64748b" stroke="none" stroke-width="1.6"/><text x="100" y="130" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">t = 0</text><text x="100" y="182" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">close (≤ 120 blocks)</text><text x="100" y="200" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">pool hotkey → escrow</text><circle cx="290" cy="150" r="9" fill="#7c3aed" stroke="none" stroke-width="1.6"/><text x="290" y="130" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">+4 h</text><text x="290" y="182" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">root deadline</text><text x="290" y="200" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">NO commits root</text><circle cx="480" cy="150" r="9" fill="#0d9488" stroke="none" stroke-width="1.6"/><text x="480" y="130" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">+48 h</text><text x="480" y="182" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">finalize</text><text x="480" y="200" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">total fixed · claims open</text><circle cx="790" cy="150" r="9" fill="#dc2626" stroke="none" stroke-width="1.6"/><text x="790" y="130" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">end of e+9</text><text x="790" y="182" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">expiry</text><text x="790" y="200" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">unclaimed → carry</text><rect x="300" y="92" width="170" height="26" rx="8" fill="#fffbeb" stroke="none" stroke-width="0"/><text x="385" y="109" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">audit window</text><path d="M480 222H530" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m7c3aed)"/><text x="536" y="226" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7c3aed" text-anchor="start">providers claim: proof of (coldkey, bps) → α</text><rect x="30" y="248" width="840" height="66" rx="10" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="46" y="270" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Missed close → that epoch's capture is deferred (recorded as 0) to the next boundary.</text><text x="46" y="288" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Missed root, or unclaimed shares at expiry → carried to the same NO's next epoch.</text><text x="46" y="306" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Pause blocks close and finalize, never claims. Roots are not challengeable on-chain; the audit is off-chain.</text></svg>
