<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Validators measure providers on server-assigned hops: Wilson-score liveness and latency percentiles, EMA-smoothed. Pools get an exposure-weighted mean quality per NO, clamped to 0.75 to 1. Head fleets get a split-adjusted count of distinct routable prefix hashes."><title>Validators measure providers on server-assigned hops: Wilson-score liveness and latency percentiles, EMA-smoothed. Pools get an exposure-weighted mean quality per NO, clamped to 0.75 to 1. Head fleets get a split-adjusted count of distinct routable prefix hashes.</title><defs><marker id="m0e7490" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs><rect width="900" height="330" rx="14" fill="#f8fafc"/><text x="30" y="32" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#475569" text-anchor="start">CHANNEL 2 · SCORING</text><text x="30" y="58" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start">How a validator scores the two tiers</text><rect x="30" y="84" width="250" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="44" y="107" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">Trail measurements</text><text x="44" y="127" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">server-assigned, non-seed hops</text><text x="44" y="144" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">liveness: Wilson-score interval</text><text x="44" y="161" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">latency: median / p95 / p99</text><text x="44" y="178" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">EMA-smoothed per provider</text><path d="M280 114H330V106H366" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m7c3aed)"/><path d="M280 150H330V214H366" fill="none" stroke="#0e7490" stroke-width="1.8" marker-end="url(#m0e7490)"/><rect x="370" y="74" width="500" height="92" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="384" y="97" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="start">Pool quality Q_n  (tail)</text><text x="384" y="117" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">exposure-weighted mean of the NO's tail providers</text><text x="384" y="134" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">(head-bound clients excluded); Q &gt; 0 is clamped to [0.75, 1]</text><text x="384" y="151" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">→ live pools differ by at most 1.33× on quality</text><rect x="370" y="178" width="500" height="92" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/><text x="384" y="201" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0e7490" text-anchor="start">Head score  (fleets)</text><text x="384" y="221" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">count distinct routable /29 IPv4 · /48 IPv6 prefix hashes</text><text x="384" y="238" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">a hash shared by k fleets counts 1/k to each</text><text x="384" y="255" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">no separate quality term: routable = it completed a hop</text><text x="30" y="302" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Each validator scores from its own trails, normalizes head to θ and pools to 1 − θ, then commits one vector (commit-reveal).</text></svg>
